"$schema" = 'https://starship.rs/config-schema.json'

format = """
[](color_orange)\
[󰄛](bg:color_orange)\
$username\
[](bg:color_yellow fg:color_orange)\
$directory\
[](fg:color_yellow bg:color_aqua)\
$git_branch\
$git_status\
$git_commit\
[](fg:color_aqua bg:color_blue)\
${custom.pros}\
${custom.cpp}\
$c\
$rust\
$golang\
$nodejs\
$php\
$javar\
$kotlin\
$haskell\
$python\
[](fg:color_blue bg:color_bg3)\
$docker_context\
$conda\
$battery\
[](fg:color_bg3 bg:color_bg1)\
$time\
[](fg:color_bg1)\
$line_break$character"""

palette = 'gruvbox_dark'

[palettes.gruvbox_dark]
color_fg0 = '#fbf1c7'
color_bg1 = '#3c3836'
color_bg3 = '#665c54'
color_blue = '#458588'
color_aqua = '#689d6a'
color_green = '#98971a'
color_orange = '#d65d0e'
color_purple = '#b16286'
color_red = '#cc241d'
color_yellow = '#d79921'

[username]
show_always = true
style_user = "bg:color_orange fg:color_fg0"
format = '[ $user ]($style)'

[directory]
style = "fg:color_fg0 bg:color_yellow"
format = "[ $path ]($style)"
truncation_length = 3
truncation_symbol = "…/"
home_symbol = ""

[directory.substitutions]
"Documents" = "󰈙"
"Downloads" = "󰭽"
"Music" = "󰝚"
"Pictures" = ""
"Developer" = "󰲋"
"Code" = "󰲋"

[git_branch]
symbol = ""
style = "bg:color_aqua"
format = '[[ $symbol $branch ](fg:color_fg0 bg:color_aqua)]($style)'

[git_status]
conflicted = '$count Conflicts '
ahead = '${count}⇡ '
diverged = '⇕${ahead_count}⇡${behind_count}⇣ '
behind = '${count}⇣ '
up_to_date = '✓'
untracked = '$count untracked files '
stashed = '$count stash\(es\) '
modified = '$count󰷈! '
staged = '$count󰑕 '
renamed = '$count renamed '
deleted = '$count '
style = "bg:color_aqua"
format = '[[($all_status$ahead_behind )](fg:color_fg0 bg:color_aqua)]($style)'

[git_commit]
commit_hash_length = 7
format = '[[\($hash$tag\)](fg:color_fg0 bg:color_aqua)]($style)'

[git_metrics]
format = '[[[+$added]($added_style)/[-$deleted]($deleted_style)](bg:color_aqua)]'

[nodejs]
symbol = ""
style = "bg:color_blue"
format = '[[ $symbol( $version) ](fg:color_fg0 bg:color_blue)]($style)'

[c]
symbol = " "
style = "bg:color_blue"
format = '[[ $symbol( $version) ](fg:color_fg0 bg:color_blue)]($style)'

[rust]
symbol = ""
style = "bg:color_blue"
format = '[[ $symbol( $version) ](fg:color_fg0 bg:color_blue)]($style)'

[golang]
symbol = ""
style = "bg:color_blue"
format = '[[ $symbol( $version) ](fg:color_fg0 bg:color_blue)]($style)'

[php]
symbol = ""
style = "bg:color_blue"
format = '[[ $symbol( $version) ](fg:color_fg0 bg:color_blue)]($style)'

[java]
symbol = ""
style = "bg:color_blue"
format = '[[ $symbol( $version) ](fg:color_fg0 bg:color_blue)]($style)'

[kotlin]
symbol = ""
style = "bg:color_blue"
format = '[[ $symbol( $version) ](fg:color_fg0 bg:color_blue)]($style)'

[haskell]
symbol = ""
style = "bg:color_blue"
format = '[[ $symbol( $version) ](fg:color_fg0 bg:color_blue)]($style)'

[python]
symbol = ""
style = "bg:color_blue"
format = '[[ $symbol( $version) ](fg:color_fg0 bg:color_blue)]($style)'

[custom.cpp]
symbol = "󰙲 "
detect_extensions = ['cpp', 'c++', 'hpp']
detect_files = ['Makefile']
style = "bg:color_blue"
description = 'Check if the current folder is a C++ one'
format = '[[ $symbol](fg:color_fg0 bg:color_blue)]($style)'

[custom.pros]
symbol = ""
detect_extensions = ['pros']
style = "bg:color_blue"
description = 'Check if the current folder is a pros one'
format = '[[ $symbol](fg:color_fg0 bg:color_blue)]($style)'

[docker_context]
symbol = ""
style = "bg:color_bg3"
format = '[[ $symbol( $context) ](fg:#83a598 bg:color_bg3)]($style)'

[conda]
style = "bg:color_bg3"
format = '[[ $symbol( $environment) ](fg:#83a598 bg:color_bg3)]($style)'

[battery]
format = '[[$symbol$percentage](fg:color_fg0 bg:color_bg3)]($style)'

[[battery.display]]
threshold = 90
style = 'bg:color_bg3'

[time]
disabled = false
time_format = "%R (%b %d)"
style = "bg:color_bg1"
format = '[[ 󰥔 $time ](fg:color_fg0 bg:color_bg1)]($style)'

[line_break]
disabled = false


[character]
disabled = false
success_symbol = ' [󰗠](fg:color_aqua)'
error_symbol = ' [](fg:color_red)'
vimcmd_symbol = '[󱞥](bold fg:color_green)'
vimcmd_replace_one_symbol = '[󱞥](bold fg:color_purple)'
vimcmd_replace_symbol = '[󱞥](bold fg:color_purple)'
vimcmd_visual_symbol = '[󱞥](bold fg:color_yellow)'
